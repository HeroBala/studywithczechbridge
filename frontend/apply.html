<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply Online — StudyCzechBridge</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header"></header>

<div class="app-page">
  <div class="container">
    <div class="form-card wide">
      <h2>Online Application Form</h2>
      <p class="sub">Fill in your details carefully — our team in Brno reviews every application personally.
        Fields marked * are required.</p>
      <div class="notice" id="apply-notice"></div>

      <form id="apply-form">
        <fieldset>
          <legend>👤 Personal Information</legend>
          <div class="form-row">
            <div class="field"><label for="a-fullName">Full Name (as in passport) *</label>
              <input type="text" id="a-fullName" required maxlength="120"></div>
            <div class="field"><label for="a-dob">Date of Birth *</label>
              <input type="date" id="a-dob" required></div>
          </div>
          <div class="form-row">
            <div class="field"><label for="a-gender">Gender</label>
              <select id="a-gender"><option value="">— Select —</option><option>Male</option><option>Female</option><option>Other</option></select></div>
            <div class="field"><label for="a-nationality">Nationality *</label>
              <select id="a-nationality" required>
                <option value="">— Select Nationality —</option>
                <option value="Bangladeshi">Bangladeshi</option>
                <option value="Indian">Indian</option>
                <option value="Nigerian">Nigerian</option>
                <option value="Ghanaian">Ghanaian</option>
                <option value="Nepalese">Nepalese</option>
                <option value="Pakistani">Pakistani</option>
                <option value="Vietnamese">Vietnamese</option>
                <option value="Egyptian">Egyptian</option>
                <option value="Turkish">Turkish</option>
                <option value="Kazakhstani">Kazakhstani</option>
                <option value="Colombian">Colombian</option>
                <option value="Brazilian">Brazilian</option>
                <option value="Ukrainian">Ukrainian</option>
                <option value="American">American</option>
                <option value="British">British</option>
                <option value="Other">Other / Worldwide</option>
              </select></div>
          </div>
          <div class="form-row">
            <div class="field"><label for="a-passportNo">Passport Number</label>
              <input type="text" id="a-passportNo" maxlength="20">
              <div class="hint">Leave empty if you don't have a passport yet.</div></div>
            <div class="field"><label for="a-phone">Phone / WhatsApp *</label>
              <input type="tel" id="a-phone" required maxlength="30" placeholder="+880 1XXXXXXXXX"></div>
          </div>
          <div class="form-row">
            <div class="field"><label for="a-address">Address *</label>
              <input type="text" id="a-address" required maxlength="200"></div>
            <div class="field"><label for="a-city">City / District *</label>
              <input type="text" id="a-city" required maxlength="80"></div>
          </div>
          <div class="form-row">
            <div class="field"><label for="a-guardianName">Guardian Name</label>
              <input type="text" id="a-guardianName" maxlength="120"></div>
            <div class="field"><label for="a-guardianPhone">Guardian Phone</label>
              <input type="tel" id="a-guardianPhone" maxlength="30"></div>
          </div>
        </fieldset>

        <fieldset>
          <legend>🎓 Education History</legend>
          <div class="form-row">
            <div class="field"><label for="a-sscResult">SSC Result (GPA) *</label>
              <input type="text" id="a-sscResult" required maxlength="10" placeholder="e.g. 5.00"></div>
            <div class="field"><label for="a-sscYear">SSC Passing Year *</label>
              <input type="number" id="a-sscYear" required min="1990" max="2035" placeholder="e.g. 2020"></div>
          </div>
          <div class="form-row">
            <div class="field"><label for="a-hscResult">HSC Result (GPA) *</label>
              <input type="text" id="a-hscResult" required maxlength="10" placeholder="e.g. 4.83"></div>
            <div class="field"><label for="a-hscYear">HSC Passing Year *</label>
              <input type="number" id="a-hscYear" required min="1990" max="2035" placeholder="e.g. 2022"></div>
          </div>
          <div class="form-row">
            <div class="field"><label for="a-bachelor">Bachelor Degree (if applying for Master's)</label>
              <input type="text" id="a-bachelor" maxlength="120" placeholder="e.g. BSc in CSE, XYZ University"></div>
            <div class="field"><label for="a-bachelorCgpa">Bachelor CGPA</label>
              <input type="text" id="a-bachelorCgpa" maxlength="10" placeholder="e.g. 3.45"></div>
          </div>
          <div class="form-row">
            <div class="field"><label for="a-englishTest">English Test</label>
              <select id="a-englishTest">
                <option value="">— Select —</option>
                <option>IELTS</option><option>TOEFL</option><option>Duolingo</option>
                <option>Planning to take</option><option>None yet</option>
              </select></div>
            <div class="field"><label for="a-englishScore">English Score</label>
              <input type="text" id="a-englishScore" maxlength="10" placeholder="e.g. 6.5"></div>
          </div>
        </fieldset>

        <fieldset>
          <legend>🏛️ Study Preference</legend>
          <div class="form-row">
            <div class="field"><label for="a-program">Desired Program *</label>
              <select id="a-program" required>
                <option value="">— Select a program —</option>
                <option>Business &amp; Economics</option>
                <option>Computer Science &amp; IT</option>
                <option>Engineering &amp; Technology</option>
                <option>Agriculture &amp; Food Science</option>
                <option>Medicine &amp; Health Sciences</option>
                <option>Social Sciences &amp; Humanities</option>
                <option>Not sure — need guidance</option>
              </select></div>
            <div class="field"><label for="a-level">Study Level *</label>
              <select id="a-level" required>
                <option value="">— Select —</option>
                <option>Bachelor's</option><option>Master's</option><option>Foundation / Language Year</option>
              </select></div>
          </div>
          <div class="form-row">
            <div class="field"><label for="a-intake">Preferred Intake *</label>
              <select id="a-intake" required>
                <option value="">— Select —</option>
                <option>September 2026</option><option>February 2027</option>
                <option>September 2027</option><option>Flexible</option>
              </select></div>
            <div class="field"></div>
          </div>
          <div class="field"><label for="a-notes">Anything else we should know?</label>
            <textarea id="a-notes" maxlength="2000" placeholder="Budget range, preferred city, scholarship interest, questions..."></textarea></div>
        </fieldset>

        <button type="submit" class="btn btn-primary btn-block" id="a-submit">Submit Application</button>
      </form>
    </div>
  </div>
</div>

<footer class="site-footer"></footer>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/apply.js"></script>
</body>
</html>
