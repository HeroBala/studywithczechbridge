<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — StudyCzechBridge</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header"></header>

<div class="app-page">
  <div class="container">
    <div class="form-card">
      <h2>Welcome Back</h2>
      <p class="sub">Log in to view your application status and documents.</p>
      <div class="notice" id="login-notice"></div>
      <form id="login-form">
        <div class="field">
          <label for="l-email">Email Address</label>
          <input type="email" id="l-email" required maxlength="160" placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="l-country">Destination Preference</label>
          <select id="l-country" style="width:100%; padding:0.6rem; border:1px solid var(--line); border-radius:6px; font-size:0.9rem; background:var(--surface); color:var(--text);">
            <option value="">Keep Saved Profile Destination</option>
            <option value="Czech Republic">🇨🇿 Czech Republic (Higher Education & Degree Roadmap)</option>
            <option value="United Kingdom">🇬🇧 United Kingdom (Study Visa / CAS / BRP / eVisa)</option>
            <option value="Iceland">🇮🇸 Iceland (Higher Education / Útlendingastofnun / Kennitala)</option>
            <option value="Sweden">🇸🇪 Sweden (University Admissions Sweden / Migrationsverket)</option>
            <option value="Austria">🇦🇹 Austria (Study Permit / OeAD Dormitories / Vienna)</option>
            <option value="Italy">🇮🇹 Italy (Universitaly / CIMEA / Permesso di Soggiorno)</option>
            <option value="Netherlands">🇳🇱 Netherlands (Recognized Sponsor / Studielink / BSN)</option>
            <option value="France">🇫🇷 France (Campus France / France-Visas / VLS-TS)</option>
            <option value="Spain">🇪🇸 Spain (Estancia por Estudios / UNEDasiss / TIE Card)</option>
            <option value="Estonia">🇪🇪 Estonia (DreamApply Estonia / Study D-Visa)</option>
            <option value="Serbia">🇷🇸 Serbia (NES Labour Test / Type D Work Visa / Single Permit)</option>
            <option value="Moldova">🇲🇩 Moldova (Employment Authorization / Long-Stay Work Visa)</option>
            <option value="Europe General">🇪🇺 Europe General (Schengen Higher Education Pathway)</option>
          </select>
        </div>
        <div class="field">
          <label for="l-pass">Password</label>
          <input type="password" id="l-pass" required placeholder="Your password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="l-submit">Log In</button>
      </form>
      <p class="center mt-2 muted">New here? <a href="register.html"><strong>Create a free account</strong></a></p>
      <p class="center muted" style="font-size:.8rem;">Forgot your password? Email
        <a href="mailto:support@studywithczechbridge.com">support@studywithczechbridge.com</a></p>
    </div>
  </div>
</div>

<footer class="site-footer"></footer>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script>
(function () {
  var s = getSession();
  if (s && s.token) {
    var isStaff = s.role === "admin" || s.role === "super_admin" || s.role === "staff" || s.role === "agent";
    location.href = isStaff ? "admin.html" : "dashboard.html";
  }
})();

document.getElementById("login-form").addEventListener("submit", function (ev) {
  ev.preventDefault();
  var btn = document.getElementById("l-submit");
  btn.disabled = true;
  btn.textContent = "Logging in...";
  var selCountry = document.getElementById("l-country").value;
  api("login", {
    email: document.getElementById("l-email").value.trim(),
    password: document.getElementById("l-pass").value
  }).then(function (res) {
    if (selCountry) {
      return api("updateMyApplication", { targetCountry: selCountry }).then(function () {
        return afterAuth(res);
      }).catch(function () {
        return afterAuth(res);
      });
    }
    return afterAuth(res);
  }).catch(function (err) {
    showNotice("login-notice", "error", err.message);
    btn.disabled = false;
    btn.textContent = "Log In";
  });
});
</script>
</body>
</html>
